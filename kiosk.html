<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Casa Cara">
<title>Casa Cara</title>
<style>
  :root {
    --teal: #1a7a76;
    --teal-dark: #0f5551;
    --teal-light: #e8f5f4;
    --sand: #f7f3ea;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #1a7a76 0%, #0f5551 55%, #08312e 100%);
    background-size: 200% 200%;
    animation: drift 30s ease infinite;
    overflow-y: auto;
    overflow-x: hidden;
    color: white;
  }
  @keyframes drift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #page {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    position: relative;
    padding-bottom: 6rem; /* room for the fixed bottom hint */
  }

  /* ---------- HERO ---------- */
  .hero {
    position: relative; width: 100%; height: 130px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .hero img {
    width: 100%; height: 100%; object-fit: cover;
    object-position: center 40%;
    display: block;
    filter: saturate(1.05);
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(15,85,81,0) 30%, var(--teal) 100%);
  }

  /* ---------- TITLE SECTION ---------- */
  .section-title {
    padding: 2.2rem 1rem 1.6rem 1rem;
  }
  .section-title h1 {
    font-size: 4rem; margin: 0; font-weight: 700; letter-spacing: 0.5px;
  }
  .section-title .sub {
    font-size: 1.1rem; opacity: 0.85; margin-top: 0.5rem;
  }

  .divider {
    width: 82%; max-width: 640px;
    height: 1px;
    background: rgba(255,255,255,0.22);
    margin: 0.4rem 0;
  }

  /* ---------- TILES SECTION ---------- */
  .section-tiles {
    padding: 1.8rem 1rem 2rem 1rem;
  }
  .tiles {
    display: flex; gap: 1.6rem; flex-wrap: wrap; justify-content: center;
    padding: 0 2rem;
  }
  .tile {
    background: rgba(255,255,255,0.97);
    color: var(--teal-dark);
    border-radius: 22px;
    width: 200px; height: 170px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-decoration: none;
    box-shadow: 0 10px 26px rgba(0,0,0,0.25);
    transition: transform 0.15s ease;
  }
  .tile:active { transform: scale(0.96); }
  .tile .icon { font-size: 3rem; margin-bottom: 0.5rem; }
  .tile .label { font-size: 1.1rem; font-weight: 600; }
  .tile .desc { font-size: 0.78rem; opacity: 0.65; margin-top: 0.25rem; }

  #footer-note {
    margin: 1.2rem auto 0 auto; text-align: center;
    width: 100%; max-width: 426px;
    color: rgba(255,255,255,0.9); font-size: 1.7rem; font-weight: 700;
  }

  /* ---------- INFO SECTION (clock / weather / tides) ---------- */
  .section-info {
    padding: 1.8rem 1rem 1rem 1rem;
    display: flex; flex-direction: column; align-items: center;
  }
  .ss-time { font-size: 4.2rem; font-weight: 200; letter-spacing: 1px; }
  .ss-date { font-size: 1.3rem; opacity: 0.9; margin-top: -0.1rem; margin-bottom: 2rem; }

  .ss-section-title {
    font-size: 0.9rem; opacity: 0.85; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 0.9rem;
  }

  .forecast-row {
    display: flex; gap: 1.1rem; margin-bottom: 2.4rem; flex-wrap: wrap; justify-content: center; padding: 0 1rem;
  }
  .forecast-day {
    background: rgba(255,255,255,0.16);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 18px;
    width: 118px; padding: 1.1rem 0.6rem;
    text-align: center;
    box-shadow: 0 8px 22px rgba(0,0,0,0.15);
  }
  .forecast-day .d { font-size: 1rem; opacity: 0.85; margin-bottom: 0.5rem; font-weight: 600; }
  .forecast-day .icon {
    font-size: 1.8rem; margin: 0 auto 0.5rem auto;
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .icon-sunny  { background: radial-gradient(circle, #ffd76b, #ffb74d); }
  .icon-cloudy { background: radial-gradient(circle, #cfd8e3, #90a4ae); }
  .icon-rainy  { background: radial-gradient(circle, #7ec8f2, #4a90c9); }
  .icon-snowy  { background: radial-gradient(circle, #eaf6ff, #b9e2fb); }
  .icon-storm  { background: radial-gradient(circle, #8b8fc9, #5c5f9e); }
  .icon-fog    { background: radial-gradient(circle, #dfe6ea, #b0bcc4); }
  .forecast-day .hi { font-size: 1.35rem; font-weight: 700; color: #fff3d6; }
  .forecast-day .lo { font-size: 1.05rem; opacity: 0.75; }

  .tide-row {
    display: flex; gap: 1.4rem; flex-wrap: wrap; justify-content: center; padding: 0 1rem;
  }
  .tide-card {
    background: rgba(255,255,255,0.16);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 18px;
    padding: 1.1rem 1.7rem;
    text-align: center;
    min-width: 165px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.15);
  }
  .tide-card .t-label { font-size: 0.95rem; opacity: 0.9; margin-bottom: 0.3rem; font-weight: 600; }
  .tide-card .t-icon { font-size: 1.6rem; margin-bottom: 0.3rem; }
  .tide-card.high .t-label { color: #7ec8f2; }
  .tide-card.low .t-label { color: #ffcf8a; }
  .tide-card .t-time { font-size: 1.5rem; font-weight: 700; color: #fff3d6; }
  .tide-card .t-height { font-size: 0.95rem; opacity: 0.75; }

  .ss-loading { opacity: 0.6; font-size: 1rem; }

  /* ---------- HOME HINT (fixed to bottom) ---------- */
  #home-hint {
    position: fixed; bottom: 0; left: 0; width: 100%;
    padding: 0.9rem 1rem 1.1rem 1rem;
    text-align: center;
    background: linear-gradient(180deg, rgba(8,49,46,0) 0%, rgba(8,49,46,0.85) 40%, rgba(8,49,46,0.95) 100%);
    color: rgba(255,255,255,0.95); font-size: 1.05rem; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
  }
  #home-hint .arrow {
    font-size: 1.6rem;
    animation: bounce-down 1.4s ease-in-out infinite;
  }
  @keyframes bounce-down {
    0%, 100% { transform: translateY(0); opacity: 0.6; }
    50% { transform: translateY(7px); opacity: 1; }
  }

  /* ---------- SCREENSAVER ---------- */
  #screensaver {
    position: fixed; inset: 0;
    background: #050505;
    display: none;
    z-index: 999;
    opacity: 0; transition: opacity 1s ease;
    overflow: hidden;
  }
  #screensaver.visible { display: block; opacity: 1; }
  #tap-me-text {
    position: absolute;
    font-size: 5rem;
    font-weight: 400;
    letter-spacing: 7px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    text-shadow: 0 0 40px rgba(255,255,255,0.15);
    animation: float-around 32s ease-in-out infinite, glow-pulse 4.5s ease-in-out infinite alternate;
    white-space: nowrap;
  }
  @keyframes float-around {
    0%   { top: 15%; left: 8%; }
    17%  { top: 55%; left: 42%; }
    34%  { top: 68%; left: 8%; }
    50%  { top: 18%; left: 40%; }
    67%  { top: 52%; left: 20%; }
    84%  { top: 28%; left: 48%; }
    100% { top: 15%; left: 8%; }
  }
  @keyframes glow-pulse {
    from { opacity: 0.5; text-shadow: 0 0 30px rgba(255,255,255,0.12); }
    to   { opacity: 0.85; text-shadow: 0 0 55px rgba(255,255,255,0.3); }
  }
</style>
</head>
<body>

<div id="page">
  <div class="hero">
    <img src="img/kiosk_house.jpg" alt="Casa Cara">
  </div>

  <div class="section-title">
    <h1>Casa Cara</h1>
    <div class="sub">2163 Avalon Ave &nbsp;·&nbsp; Avalon, NJ 08202</div>
  </div>

  <div class="divider"></div>

  <div class="section-tiles">
    <div class="tiles">
      <a class="tile" href="https://jauen-w48.github.io/cascara/index.html?kiosk=1">
        <div class="icon">📖</div>
        <div class="label">Guest Guide</div>
        <div class="desc">House info &amp; how-to's</div>
      </a>
      <a class="tile" href="music://" onclick="tryOpenMusic(event)">
        <div class="icon">🎵</div>
        <div class="label">Music</div>
        <div class="desc">Open Apple Music</div>
      </a>
    </div>
    <div id="footer-note">Tap a tile to get started</div>
  </div>

  <div class="divider"></div>

  <div class="section-info">
    <div class="ss-time" id="ss-clock">--:--</div>
    <div class="ss-date" id="ss-date">Loading...</div>

    <div class="ss-section-title">5-Day Forecast</div>
    <div class="forecast-row" id="forecast-row">
      <div class="ss-loading">Loading weather…</div>
    </div>

    <div class="ss-section-title">Tides Today</div>
    <div class="tide-row" id="tide-row">
      <div class="ss-loading">Loading tides…</div>
    </div>
  </div>
</div>

<div id="home-hint">
  <span>Press HOME BUTTON, then CASA CARA to return here from music app</span>
  <span class="arrow">⬇️</span>
</div>

<div id="screensaver" onclick="wakeFromScreensaver(event)">
  <div id="tap-me-text">Tap Me</div>
</div>

<script>
  // ---------- Config ----------
  const LAT = 39.1001, LON = -74.7157; // Avalon, NJ
  const TIDE_STATION = "8536110"; // NOAA Cape May, NJ — nearest official tide prediction station to Avalon
  const REFRESH_MS = 30 * 60 * 1000; // refresh weather/tide data every 30 min

  // ---------- Apple Music app open ----------
  // No fallback needed — Music is a built-in system app that's always present.
  // (A fallback timer here previously caused false redirects to the App Store
  // in standalone/Home-Screen mode, since the blur event it relied on doesn't
  // fire reliably in that mode even when the app opens successfully.)
  function tryOpenMusic(e) {
    e.preventDefault();
    window.location.href = "music://";
  }

  // ---------- Clock ----------
  function updateClock() {
    const now = new Date();
    const opts = { hour: "numeric", minute: "2-digit" };
    document.getElementById("ss-clock").textContent = now.toLocaleTimeString("en-US", opts);
    document.getElementById("ss-date").textContent = now.toLocaleDateString("en-US", {
      weekday: "long", month: "long", day: "numeric"
    });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ---------- Weather (Open-Meteo, no API key required) ----------
  const weatherIcons = {
    0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️",
    45: "🌫️", 48: "🌫️",
    51: "🌦️", 53: "🌦️", 55: "🌧️",
    61: "🌧️", 63: "🌧️", 65: "🌧️",
    71: "🌨️", 73: "🌨️", 75: "❄️",
    80: "🌦️", 81: "🌧️", 82: "⛈️",
    95: "⛈️", 96: "⛈️", 99: "⛈️"
  };
  const weatherIconClass = {
    0: "icon-sunny", 1: "icon-sunny", 2: "icon-cloudy", 3: "icon-cloudy",
    45: "icon-fog", 48: "icon-fog",
    51: "icon-rainy", 53: "icon-rainy", 55: "icon-rainy",
    61: "icon-rainy", 63: "icon-rainy", 65: "icon-rainy",
    71: "icon-snowy", 73: "icon-snowy", 75: "icon-snowy",
    80: "icon-rainy", 81: "icon-rainy", 82: "icon-storm",
    95: "icon-storm", 96: "icon-storm", 99: "icon-storm"
  };

  async function loadWeather() {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=weathercode,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=5`;
      const res = await fetch(url);
      const data = await res.json();
      const row = document.getElementById("forecast-row");
      row.innerHTML = "";
      data.daily.time.forEach((dateStr, i) => {
        const date = new Date(dateStr + "T12:00:00");
        const dayLabel = i === 0 ? "Today" : date.toLocaleDateString("en-US", { weekday: "short" });
        const icon = weatherIcons[data.daily.weathercode[i]] || "🌡️";
        const iconClass = weatherIconClass[data.daily.weathercode[i]] || "icon-cloudy";
        const hi = Math.round(data.daily.temperature_2m_max[i]);
        const lo = Math.round(data.daily.temperature_2m_min[i]);
        const el = document.createElement("div");
        el.className = "forecast-day";
        el.innerHTML = `<div class="d">${dayLabel}</div><div class="icon ${iconClass}">${icon}</div><div class="hi">${hi}°</div><div class="lo">${lo}°</div>`;
        row.appendChild(el);
      });
    } catch (err) {
      document.getElementById("forecast-row").innerHTML = '<div class="ss-loading">Weather unavailable</div>';
    }
  }

  // ---------- Tides (NOAA CO-OPS API, no API key required) ----------
  async function loadTides() {
    try {
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, "0");
      const d = String(today.getDate()).padStart(2, "0");
      const dateStr = `${y}${m}${d}`;
      const url = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?begin_date=${dateStr}&end_date=${dateStr}&station=${TIDE_STATION}&product=predictions&datum=MLLW&time_zone=lst_ldt&units=english&interval=hilo&format=json`;
      const res = await fetch(url);
      const data = await res.json();
      const row = document.getElementById("tide-row");
      row.innerHTML = "";
      if (!data.predictions) throw new Error("no data");
      data.predictions.forEach(p => {
        const label = p.type === "H" ? "High Tide" : "Low Tide";
        const tideIcon = p.type === "H" ? "🌊⬆️" : "🌊⬇️";
        const t = new Date(p.t.replace(" ", "T"));
        const timeStr = t.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
        const el = document.createElement("div");
        el.className = "tide-card " + (p.type === "H" ? "high" : "low");
        el.innerHTML = `<div class="t-icon">${tideIcon}</div><div class="t-label">${label}</div><div class="t-time">${timeStr}</div><div class="t-height">${parseFloat(p.v).toFixed(1)} ft</div>`;
        row.appendChild(el);
      });
    } catch (err) {
      document.getElementById("tide-row").innerHTML = '<div class="ss-loading">Tide data unavailable</div>';
    }
  }

  loadWeather();
  loadTides();
  setInterval(loadWeather, REFRESH_MS);
  setInterval(loadTides, REFRESH_MS);

  // ---------- Idle detection -> simple "Tap Me" screensaver ----------
  const IDLE_TIMEOUT_MS = 60 * 1000; // 60s idle before screensaver appears
  const screensaver = document.getElementById("screensaver");
  const page = document.getElementById("page");
  let idleTimer;

  function showScreensaver() {
    screensaver.classList.add("visible");
  }
  window.wakeFromScreensaver = function (e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    screensaver.classList.remove("visible");
    resetIdleTimer();
  };
  function resetIdleTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(showScreensaver, IDLE_TIMEOUT_MS);
  }
  ["click", "touchstart", "mousemove", "scroll"].forEach(function (evt) {
    page.addEventListener(evt, resetIdleTimer, { passive: true });
  });

  // Whenever the kiosk app is (re)opened or comes back to the foreground —
  // e.g. after being backgrounded and iOS suspending it — treat that as
  // fresh activity so a stale, already-expired timer doesn't instantly
  // show the screensaver the moment it becomes visible again.
  function wakeOnForeground() {
    screensaver.classList.remove("visible");
    resetIdleTimer();
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") wakeOnForeground();
  });
  window.addEventListener("pageshow", wakeOnForeground);

  resetIdleTimer();
</script>

</body>
</html>
